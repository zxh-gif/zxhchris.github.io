<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML圣诞树</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #000;
            overflow: hidden;
        }
        .tree {
            position: relative;
            transform-style: preserve-3d;
            animation: rotate 20s linear infinite;
        }
        @keyframes rotate {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(360deg); }
        }
        .star {
            position: absolute;
            top: -50px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 40px;
            background: #ffd700;
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            animation: glow 1.5s ease-in-out infinite alternate;
        }
        @keyframes glow {
            from { box-shadow: 0 0 10px #ffd700; }
            to { box-shadow: 0 0 30px #ffd700, 0 0 60px #ffd700; }
        }
        .leaves {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 80px solid transparent;
            border-right: 80px solid transparent;
            border-bottom: 120px solid #0f9d58;
        }
        .leaves-1 { top: 0; }
        .leaves-2 { top: 80px; border-left-width: 100px; border-right-width: 100px; border-bottom-width: 150px; }
        .leaves-3 { top: 180px; border-left-width: 120px; border-right-width: 120px; border-bottom-width: 180px; }
        .trunk {
            position: absolute;
            top: 300px;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 80px;
            background: #8b4513;
        }
        .light {
            position: absolute;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            animation: blink 1s ease-in-out infinite alternate;
        }
        @keyframes blink {
            from { opacity: 0.7; }
            to { opacity: 1; }
        }
        .snow {
            position: fixed;
            color: #fff;
            font-size: 20px;
            animation: fall linear infinite;
        }
        @keyframes fall {
            0% { transform: translateY(-100vh); }
            100% { transform: translateY(100vh); }
        }
    </style>
</head>
<body>
    <div class="tree">
        <div class="star"></div>
        <div class="leaves leaves-1"></div>
        <div class="leaves leaves-2"></div>
        <div class="leaves leaves-3"></div>
        <div class="trunk"></div>
    </div>

    <script>
        // 生成装饰灯
        const colors = ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff'];
        for (let i = 0; i < 15; i++) {
            const light = document.createElement('div');
            light.className = 'light';
            light.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            light.style.left = `${Math.random() * 200 - 100}px`;
            light.style.top = `${Math.random() * 250}px`;
            light.style.animationDelay = `${Math.random()}s`;
            document.querySelector('.tree').appendChild(light);
        }

        // 生成雪花
        function createSnow() {
            const snow = document.createElement('div');
            snow.className = 'snow';
            snow.innerHTML = '❄';
            snow.style.left = `${Math.random() * 100}vw`;
            snow.style.animationDuration = `${Math.random() * 5 + 5}s`;
            document.body.appendChild(snow);
            setTimeout(() => snow.remove(), 10000);
        }
        setInterval(createSnow, 200);
    </script>
</body>
</html>
